<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 产业链二阶推演与投资决策观测站</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
        .status-bar { text-align: center; font-size: 0.85rem; color: #64748b; margin-bottom: 25px; }
        .status-badge { background: #e2e8f0; padding: 3px 10px; border-radius: 12px; }
        
        .card { background: #ffffff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .source-tag { font-size: 0.8rem; background: #eff6ff; color: #2563eb; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .time-tag { font-size: 0.8rem; color: #94a3b8; }
        .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; line-height: 1.4; color: #1e293b; }
        
        .section { margin-top: 10px; font-size: 0.92rem; line-height: 1.5; }
        .label { font-weight: bold; color: #475569; }
        .order1 { color: #0369a1; background: #f0f9ff; padding: 8px 12px; border-radius: 6px; margin-top: 6px; }
        .order2 { color: #7c2d12; background: #fff7ed; padding: 8px 12px; border-radius: 6px; margin-top: 6px; }
        
        .empty-state { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI 产业链二阶推演与投资决策观测站</h1>
        <div class="status-bar">
            <span class="status-badge" id="update-time">最后更新时间: 加载中...</span>
        </div>

        <div id="cards-container">
            <div class="empty-state">正在拉取最新推理数据...</div>
        </div>
    </div>

    <script>
        async function fetchResults() {
            const container = document.getElementById('cards-container');
            const timeTag = document.getElementById('update-time');

            try {
                // 加上时间戳缓存刷写机制 ?t=...
                const response = await fetch('./results.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('无法获取 JSON 数据');
                
                const data = await response.json();

                // 兼容逻辑：判断 data 是数组还是带 cards 的对象
                let cardsList = [];
                let lastUpdated = '实时更新';

                if (Array.isArray(data)) {
                    cardsList = data;
                } else if (data && typeof data === 'object') {
                    cardsList = data.cards || [];
                    lastUpdated = data.updated_at || lastUpdated;
                }

                timeTag.innerText = '最后更新时间: ' + lastUpdated;

                if (!cardsList || cardsList.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无最新推演卡片。</div>';
                    return;
                }

                container.innerHTML = '';
                cardsList.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <span class="source-tag">${item.source_name || '官方资讯'}</span>
                                <span class="time-tag">${item.published_at || ''}</span>
                            </div>
                            <div class="title">${item.title}</div>
                            <div class="section order1">
                                <span class="label">🎯 一阶直接影响：</span>${item.first_order_impact || '暂无分析'}
                            </div>
                            <div class="section order2">
                                <span class="label">🧩 二阶推演：</span>${item.second_order_reasoning || '暂无推演'}
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                timeTag.innerText = '最后更新时间: 读取失败';
                container.innerHTML = '<div class="empty-state">加载数据失败，请检查 results.json 路径。</div>';
            }
        }

        fetchResults();
    </script>
</body>
</html>
