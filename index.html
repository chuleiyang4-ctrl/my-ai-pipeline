<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 产业链二阶推演 · 实时资讯观测站</title>
<style>
:root{
  --bg-0:#090D16;
  --bg-1:#0F172A;
  --card-bg:rgba(15,23,42,0.65);
  --card-border:#1E293B;
  --gold:#F59E0B;
  --cyan:#38BDF8;
  --text:#E2E8F0;
  --text-dim:#94A3B8;
  --text-muted:#64748B;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --radius:16px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(ellipse at top,#111827 0%,var(--bg-0) 50%,#050810 100%);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  padding-bottom:80px;
}
.container{max-width:960px;margin:0 auto;padding:32px 20px}

/* Header */
.header{
  text-align:center;
  padding:48px 24px 32px;
  position:relative;
}
.header::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(245,158,11,0.08) 0%,transparent 60%);
  pointer-events:none;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(56,189,248,0.1));
  border:1px solid rgba(245,158,11,0.3);
  border-radius:999px;
  padding:6px 16px;
  font-size:13px;font-weight:600;
  color:var(--gold);
  letter-spacing:0.05em;
  margin-bottom:16px;
}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.header h1{
  font-size:clamp(28px,5vw,42px);
  font-weight:800;
  background:linear-gradient(135deg,#fff 30%,var(--gold) 70%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.2;
  margin-bottom:12px;
}
.header p{color:var(--text-dim);max-width:600px;margin:0 auto;font-size:15px}
.nav-links{display:flex;gap:12px;justify-content:center;margin-top:20px}
.nav-links a{
  color:var(--text-dim);text-decoration:none;font-size:13px;
  padding:6px 14px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--card-bg);backdrop-filter:blur(8px);
  transition:all .2s;
}
.nav-links a:hover{color:var(--gold);border-color:var(--gold)}
.nav-links a.active{color:var(--gold);border-color:var(--gold)}

/* Status bar */
.status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;margin:0 0 24px;
  background:var(--card-bg);backdrop-filter:blur(12px);
  border:1px solid var(--card-border);border-radius:var(--radius);
  font-size:13px;color:var(--text-dim);
}
.status-bar .left{display:flex;align-items:center;gap:8px}
.status-bar .pulse{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
.status-bar .time{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}

/* Cards */
.cards{display:flex;flex-direction:column;gap:20px}
.card{
  background:var(--card-bg);backdrop-filter:blur(12px);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:28px;
  box-shadow:var(--shadow);
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-2px);border-color:rgba(245,158,11,0.4);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--cyan));
  opacity:0.8;
}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.badge{
  display:inline-block;
  padding:4px 12px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:0.05em;
  background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(245,158,11,0.05));
  border:1px solid rgba(245,158,11,0.4);
  color:var(--gold);
}
.card-time{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.card-title{
  font-size:18px;font-weight:700;line-height:1.4;margin-bottom:14px;
  color:#F1F5F9;
}
.card-section{margin-bottom:12px}
.card-section .label{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--cyan);
  margin-bottom:4px;
}
.card-section .label .icon{font-size:14px}
.card-section .content{font-size:14px;color:var(--text);line-height:1.7}
.card-section .content.muted{color:var(--text-dim)}
.card-divider{height:1px;background:linear-gradient(90deg,transparent,var(--card-border),transparent);margin:16px 0}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px}
.source-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none;
  padding:6px 14px;border-radius:8px;
  border:1px solid rgba(56,189,248,0.4);
  background:rgba(56,189,248,0.08);
  transition:all .2s;
}
.source-btn:hover{background:rgba(56,189,248,0.15);border-color:var(--cyan)}
.disclaimer{font-size:11px;color:var(--text-muted);font-style:italic}
.fallback-tag{
  display:inline-block;padding:2px 8px;border-radius:6px;
  font-size:10px;font-weight:700;letter-spacing:0.08em;
  background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);
  color:var(--warning);margin-left:8px;
}

/* Loading */
.loading{
  text-align:center;padding:60px 20px;color:var(--text-dim);
}
.loading .spinner{
  width:40px;height:40px;border:3px solid var(--card-border);
  border-top-color:var(--gold);border-radius:50%;
  margin:0 auto 16px;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* Floating AI Widget */
.ai-widget{
  position:fixed;bottom:24px;right:24px;z-index:100;
  background:var(--card-bg);backdrop-filter:blur(16px);
  border:1px solid rgba(245,158,11,0.4);
  border-radius:999px;
  padding:12px 20px;
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  transition:all .25s;
  font-size:14px;font-weight:600;color:var(--text);
}
.ai-widget:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.6);border-color:var(--gold)}
.ai-widget .icon{font-size:18px}

/* Chat panel */
.chat-panel{
  position:fixed;top:0;right:-420px;width:400px;max-width:90vw;height:100vh;
  background:rgba(9,13,22,0.98);backdrop-filter:blur(20px);
  border-left:1px solid var(--card-border);
  z-index:200;transition:right .35s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;
  box-shadow:-8px 0 32px rgba(0,0,0,0.5);
}
.chat-panel.open{right:0}
.chat-header{
  padding:20px;border-bottom:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:space-between;
}
.chat-title{display:flex;align-items:center;gap:10px;font-weight:700}
.chat-title .icon{font-size:20px}
.chat-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:20px;padding:4px}
.chat-close:hover{color:var(--text)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{
  max-width:85%;padding:10px 14px;border-radius:12px;
  font-size:14px;line-height:1.5;
}
.chat-msg.ai{background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.25);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.user{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);align-self:flex-end;border-bottom-right-radius:4px}
.chat-input-wrap{padding:16px;border-top:1px solid var(--card-border);display:flex;gap:8px}
.chat-input{
  flex:1;background:rgba(15,23,42,0.6);border:1px solid var(--card-border);
  border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;
  outline:none;transition:border-color .2s;
}
.chat-input:focus{border-color:var(--gold)}
.chat-send{
  background:var(--gold);color:#000;border:none;border-radius:12px;
  padding:0 16px;font-weight:700;cursor:pointer;font-size:18px;
  transition:all .2s;
}
.chat-send:hover{background:#FBBF24}
.chat-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px);
  z-index:150;opacity:0;pointer-events:none;transition:opacity .3s;
}
.chat-overlay.active{opacity:1;pointer-events:auto}

@media(max-width:640px){
  .container{padding:20px 14px}
  .card{padding:20px}
  .header{padding:32px 16px 24px}
  .ai-widget{bottom:16px;right:16px;padding:10px 16px;font-size:13px}
}
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand"><span class="dot"></span>AI INDUSTRY PULSE</div>
    <h1>AI 产业链二阶推演<br/>实时资讯观测站</h1>
    <p>基于公开 AI 新闻的 AI 驱动结构化分析 · 事实摘要 → 一阶影响 → 二阶推演</p>
    <nav class="nav-links">
      <a href="index.html" class="active">📰 资讯推演</a>
      <a href="pro.html">🎯 Pro 决策版</a>
      <a href="winrate.html">📊 胜率看板</a>
    </nav>
  </header>

  <div class="status-bar">
    <div class="left"><span class="pulse"></span><span id="source-label">实时数据源</span></div>
    <div>更新时间：<span class="time" id="update-time">加载中...</span></div>
  </div>

  <div class="cards" id="cards-container">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在抓取并解析最新 AI 资讯...</p>
    </div>
  </div>
</div>

<!-- Floating AI Widget -->
<div class="ai-widget" id="ai-widget" title="Ask AI Tutor">
  <span class="icon">💬</span>
  <span>Ask AI Tutor</span>
</div>

<!-- Chat overlay -->
<div class="chat-overlay" id="chat-overlay"></div>

<!-- Chat panel -->
<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <div class="chat-title"><span class="icon">🤖</span> AI Tutor</div>
    <button class="chat-close" id="chat-close">×</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-msg ai">你好！我是你的 AI 产业分析助手。你可以问我：<br/><br/>• "最新的 AI 政策有哪些影响？"<br/>• "具身智能板块近期有什么进展？"<br/>• "帮我分析这条新闻的投资含义"</div>
  </div>
  <div class="chat-input-wrap">
    <input class="chat-input" id="chat-input" placeholder="输入你的问题..." />
    <button class="chat-send" id="chat-send">➤</button>
  </div>
</div>

<script>
// === CONFIGURATION: Update RAW_URL to your GitHub repo path ===
const RAW_URL = 'https://raw.githubusercontent.com/chuleiyang4-ctrl/my-ai-pipeline/main/results.json';
const FALLBACK_URL = './results.json';

async function fetchWithFallback() {
  const cacheBuster = '?t=' + Date.now();
  try {
    const res = await fetch(RAW_URL + cacheBuster, { cache: 'no-store' });
    if (!res.ok) throw new Error('CDN fetch failed');
    const data = await res.json();
    document.getElementById('source-label').textContent = '数据源：GitHub Raw CDN';
    return data;
  } catch (e) {
    console.warn('Primary URL failed, trying fallback:', e);
    try {
      const res = await fetch(FALLBACK_URL + cacheBuster, { cache: 'no-store' });
      if (!res.ok) throw new Error('Fallback fetch failed');
      const data = await res.json();
      document.getElementById('source-label').textContent = '数据源：本地缓存';
      return data;
    } catch (e2) {
      throw new Error('All fetch attempts failed');
    }
  }
}

function formatTime(isoStr) {
  if (!isoStr) return '';
  try {
    const d = new Date(isoStr);
    return d.toLocaleString('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', timeZone: 'UTC'
    }) + ' UTC';
  } catch { return isoStr; }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderCard(card) {
  const title = escapeHtml(card.title || 'Untitled');
  const summary = escapeHtml(card.summary || '');
  const firstImpact = escapeHtml(card.first_order_impact || '');
  const secondReasoning = escapeHtml(card.second_order_reasoning || '');
  const sourceUrl = escapeHtml(card.source_url || '#');
  const category = escapeHtml(card.category || 'AI应用');
  const reasonedAt = formatTime(card.reasoned_at || card.published || '');
  const isFallback = card.is_fallback;

  return `
    <article class="card">
      <div class="card-header">
        <span class="badge">${category}</span>
        ${isFallback ? '<span class="fallback-tag">RULE-BASED</span>' : ''}
        <span class="card-time">📅 ${reasonedAt}</span>
      </div>
      <h2 class="card-title">${title}</h2>
      ${summary ? `
        <div class="card-section">
          <div class="label"><span class="icon">📌</span> 事实摘要</div>
          <div class="content">${summary}</div>
        </div>
      ` : ''}
      ${firstImpact ? `
        <div class="card-section">
          <div class="label"><span class="icon">⚡</span> 一阶影响</div>
          <div class="content muted">${firstImpact}</div>
        </div>
      ` : ''}
      ${secondReasoning ? `
        <div class="card-section">
          <div class="label"><span class="icon">🔮</span> 二阶推演</div>
          <div class="content muted">${secondReasoning}</div>
        </div>
      ` : ''}
      <div class="card-divider"></div>
      <div class="card-footer">
        <a class="source-btn" href="${sourceUrl}" target="_blank" rel="noopener">
          🔗 查看原文 ↗
        </a>
        <span class="disclaimer">以上为 AI 基于新闻的推测性分析，非事实陈述</span>
      </div>
    </article>
  `;
}

async function init() {
  try {
    const data = await fetchWithFallback();
    const cards = data.cards || [];
    const container = document.getElementById('cards-container');

    if (!cards.length) {
      container.innerHTML = '<div class="loading"><p>暂无数据，请稍后刷新</p></div>';
      return;
    }

    container.innerHTML = cards.map(renderCard).join('');
    const updateTime = data.updated_at || '';
    if (updateTime) {
      document.getElementById('update-time').textContent = formatTime(updateTime);
    }
  } catch (e) {
    console.error(e);
    document.getElementById('cards-container').innerHTML =
      '<div class="loading"><p>⚠️ 数据加载失败，请检查网络或稍后重试</p></div>';
    document.getElementById('update-time').textContent = '加载失败';
  }
}

// AI Chat Widget
const widget = document.getElementById('ai-widget');
const panel = document.getElementById('chat-panel');
const overlay = document.getElementById('chat-overlay');
const closeBtn = document.getElementById('chat-close');

widget.addEventListener('click', () => {
  panel.classList.add('open');
  overlay.classList.add('active');
});
closeBtn.addEventListener('click', closeChat);
overlay.addEventListener('click', closeChat);

function closeChat() {
  panel.classList.remove('open');
  overlay.classList.remove('active');
}

const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatMessages = document.getElementById('chat-messages');

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const val = chatInput.value.trim();
  if (!val) return;
  addMessage(val, 'user');
  chatInput.value = '';

  setTimeout(() => {
    const responses = [
      '这是一个很好的问题。根据当前 AI 产业趋势，我建议关注以下几个方面：\n\n1. 政策监管动态\n2. 基础模型迭代节奏\n3. 垂直领域应用落地\n\n需要我针对某个具体方向深入分析吗？',
      '从二阶推演的角度来看，这类事件的影响通常分为：\n\n• 短期：相关板块情绪波动\n• 中期：产业链重构机会\n• 长期：新范式确立\n\n你想聚焦哪个时间维度？',
      '根据当前资讯快照，我建议重点关注「具身智能」和「金融 Agent」两个方向，它们分别代表了 AI 的 Physical 和 Commercial 两个前沿。',
    ];
    addMessage(responses[Math.floor(Math.random() * responses.length)], 'ai');
  }, 600);
}

init();
</script>

</body>
</html>
