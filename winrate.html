<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 预测胜率看板</title>
<style>
:root{
  --bg-0:#060912;
  --bg-1:#0A0F1E;
  --card-bg:rgba(10,15,30,0.8);
  --card-border:#1A2332;
  --gold:#F59E0B;
  --cyan:#38BDF8;
  --green:#10B981;
  --green-dim:rgba(16,185,129,0.15);
  --red:#EF4444;
  --red-dim:rgba(239,68,68,0.15);
  --purple:#8B5CF6;
  --purple-dim:rgba(139,92,246,0.15);
  --text:#E2E8F0;
  --text-dim:#94A3B8;
  --text-muted:#64748B;
  --radius:14px;
  --shadow:0 4px 24px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(ellipse at top,#0D1526 0%,var(--bg-0) 60%,#030508 100%);
  color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:80px;
}
.container{max-width:1100px;margin:0 auto;padding:32px 20px}

/* Header */
.header{text-align:center;padding:40px 24px 20px}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(56,189,248,0.1));
  border:1px solid rgba(16,185,129,0.4);
  border-radius:999px;padding:6px 16px;
  font-size:13px;font-weight:600;color:var(--green);
  letter-spacing:0.05em;margin-bottom:16px;
}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.header h1{
  font-size:clamp(26px,4.5vw,40px);font-weight:800;
  background:linear-gradient(135deg,#fff 20%,var(--green) 50%,var(--cyan) 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.2;margin-bottom:10px;
}
.header p{color:var(--text-dim);max-width:600px;margin:0 auto;font-size:14px}
.nav-links{display:flex;gap:12px;justify-content:center;margin-top:18px}
.nav-links a{
  color:var(--text-dim);text-decoration:none;font-size:13px;
  padding:6px 14px;border-radius:8px;border:1px solid var(--card-border);
  background:var(--card-bg);backdrop-filter:blur(8px);transition:all .2s;
}
.nav-links a:hover{color:var(--green);border-color:var(--green)}
.nav-links a.active{color:var(--green);border-color:var(--green)}

/* Summary cards */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.summary-card{
  background:var(--card-bg);backdrop-filter:blur(14px);
  border:1px solid var(--card-border);border-radius:var(--radius);
  padding:20px;text-align:center;transition:transform .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.summary-card:hover{transform:translateY(-2px)}
.summary-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--green),var(--cyan));
}
.summary-card .label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
.summary-card .value{font-size:32px;font-weight:800}
.summary-card .sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.value.green{color:var(--green)}
.value.red{color:var(--red)}
.value.gold{color:var(--gold)}
.value.cyan{color:var(--cyan)}

/* Section */
.section{margin-bottom:32px}
.section-title{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
  font-size:18px;font-weight:700;color:#F1F5F9;
}
.section-title .icon{font-size:22px}
.section-desc{font-size:13px;color:var(--text-dim);margin-bottom:14px}

/* Chart / bar table */
.bar-chart{
  background:var(--card-bg);backdrop-filter:blur(12px);
  border:1px solid var(--card-border);border-radius:var(--radius);
  padding:20px;
}
.bar-row{
  display:grid;grid-template-columns:140px 1fr 80px;gap:16px;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(30,41,59,0.6);
}
.bar-row:last-child{border-bottom:none}
.bar-label{font-size:13px;color:var(--text);font-weight:600}
.bar-track{height:24px;background:rgba(30,41,59,0.6);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width 0.6s ease}
.bar-fill.green{background:linear-gradient(90deg,var(--green),rgba(16,185,129,0.6))}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),rgba(245,158,11,0.6))}
.bar-fill.red{background:linear-gradient(90deg,var(--red),rgba(239,68,68,0.6))}
.bar-value{text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

/* Detail table */
.detail-table{width:100%;border-collapse:separate;border-spacing:0}
.detail-table th{
  font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--text-dim);text-align:left;padding:10px 14px;
  background:rgba(15,23,42,0.5);
}
.detail-table td{
  padding:12px 14px;border-top:1px solid rgba(30,41,59,0.5);
  font-size:13px;vertical-align:top;
}
.detail-table tr:hover td{background:rgba(15,23,42,0.3)}
.detail-table .status-badge{
  display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;
}
.status-badge.pending{background:rgba(100,116,139,0.2);color:var(--text-dim);border:1px solid var(--text-muted)}
.status-badge.hit{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,0.4)}
.status-badge.miss{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.4)}
.status-badge.partial{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,158,11,0.4)}
.countdown{font-weight:600;color:var(--cyan);font-variant-numeric:tabular-nums}
.countdown.urgent{color:var(--red)}

.pred-detail-btn{
  background:none;border:1px solid var(--card-border);color:var(--text-dim);
  font-size:12px;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .2s;
}
.pred-detail-btn:hover{color:var(--gold);border-color:var(--gold)}
.pred-detail-row{
  display:none;background:rgba(15,23,42,0.4);
}
.pred-detail-row.show{display:table-row}
.pred-detail-row td{padding:14px 20px}
.pred-detail-row p{font-size:13px;color:var(--text-dim);line-height:1.6}

.tab-bar{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{
  background:var(--card-bg);backdrop-filter:blur(8px);
  border:1px solid var(--card-border);color:var(--text-dim);
  padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .2s;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--green);border-color:var(--green)}

.table-wrap{
  background:var(--card-bg);backdrop-filter:blur(12px);
  border:1px solid var(--card-border);border-radius:var(--radius);
  overflow:hidden;
}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--text-dim)}
.loading .spinner{
  width:40px;height:40px;border:3px solid var(--card-border);
  border-top-color:var(--green);border-radius:50%;
  margin:0 auto 16px;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Floating AI Widget */
.ai-widget{
  position:fixed;bottom:24px;right:24px;z-index:100;
  background:var(--card-bg);backdrop-filter:blur(16px);
  border:1px solid rgba(16,185,129,0.5);
  border-radius:999px;padding:12px 20px;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);transition:all .25s;
  font-size:14px;font-weight:600;color:var(--text);
}
.ai-widget:hover{transform:translateY(-3px);border-color:var(--green)}
.ai-widget .icon{font-size:18px}

.chat-panel{
  position:fixed;top:0;right:-420px;width:400px;max-width:90vw;height:100vh;
  background:rgba(6,9,18,0.98);backdrop-filter:blur(20px);
  border-left:1px solid var(--card-border);z-index:200;
  transition:right .35s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,0.6);
}
.chat-panel.open{right:0}
.chat-header{padding:20px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between}
.chat-title{display:flex;align-items:center;gap:10px;font-weight:700}
.chat-title .icon{font-size:20px}
.chat-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:20px;padding:4px}
.chat-close:hover{color:var(--text)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.chat-msg.ai{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-msg.user{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.25);align-self:flex-end;border-bottom-right-radius:4px}
.chat-input-wrap{padding:16px;border-top:1px solid var(--card-border);display:flex;gap:8px}
.chat-input{flex:1;background:rgba(10,15,30,0.6);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.chat-input:focus{border-color:var(--green)}
.chat-send{background:var(--green);color:#000;border:none;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer;font-size:18px;transition:all .2s}
.chat-send:hover{filter:brightness(1.1)}
.chat-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.chat-overlay.active{opacity:1;pointer-events:auto}

@media(max-width:640px){
  .container{padding:20px 12px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .bar-row{grid-template-columns:100px 1fr 60px;gap:8px}
  .bar-label{font-size:11px}
  .ai-widget{bottom:16px;right:16px;padding:10px 16px;font-size:13px}
}
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand"><span class="dot"></span>PREDICTION WINRATE DASHBOARD</div>
    <h1>AI 预测胜率看板</h1>
    <p>历史预测回溯验证结果 · 置信度校准 · 分类命中率对比</p>
    <nav class="nav-links">
      <a href="index.html">📰 资讯推演</a>
      <a href="pro.html">🎯 Pro 决策版</a>
      <a href="winrate.html" class="active">📊 胜率看板</a>
    </nav>
  </header>

  <div id="dashboard">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载预测数据...</p>
    </div>
  </div>
</div>

<div class="ai-widget" id="ai-widget" title="Ask AI Tutor">
  <span class="icon">💬</span>
  <span>Ask AI Tutor</span>
</div>

<div class="chat-overlay" id="chat-overlay"></div>
<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <div class="chat-title"><span class="icon">🤖</span> AI Tutor</div>
    <button class="chat-close" id="chat-close">×</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-msg ai">你好！我可以帮你解读胜率看板的数据。试试问：<br/><br/>• "为什么高置信度预测反而可能不准？"<br/>• "哪个板块的预测最可靠？"<br/>• "partial 命中算 0.5 权重是什么意思？"</div>
  </div>
  <div class="chat-input-wrap">
    <input class="chat-input" id="chat-input" placeholder="Ask about the data..." />
    <button class="chat-send" id="chat-send">➤</button>
  </div>
</div>

<script>
// === CONFIGURATION: Update URL to your GitHub repo path ===
const PREDICTIONS_URL = 'https://raw.githubusercontent.com/chuleiyang4-ctrl/my-ai-pipeline/main/predictions.json';
const FALLBACK_URL = './predictions.json';

async function fetchJSON(url) {
  const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('Failed');
  return res.json();
}

async function loadPredictions() {
  try { return await fetchJSON(PREDICTIONS_URL); }
  catch { return await fetchJSON(FALLBACK_URL); }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function daysUntilDeadline(deadlineStr) {
  if (!deadlineStr) return null;
  const deadline = new Date(deadlineStr + 'T23:59:59Z');
  const now = new Date();
  const diff = deadline - now;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function renderDashboard(predictions) {
  const total = predictions.length;
  const pending = predictions.filter(p => p.status === 'pending');
  const resolved = predictions.filter(p => ['hit','miss','partial'].includes(p.status));

  const hit = resolved.filter(p => p.status === 'hit').length;
  const miss = resolved.filter(p => p.status === 'miss').length;
  const partial = resolved.filter(p => p.status === 'partial').length;
  const resolvedTotal = hit + miss + partial;
  const weightedCorrect = hit + partial * 0.5;
  const winrate = resolvedTotal > 0 ? (weightedCorrect / resolvedTotal * 100) : null;

  // By category
  const byCategory = {};
  resolved.forEach(p => {
    const cat = p.category || 'Unknown';
    if (!byCategory[cat]) byCategory[cat] = { hit:0, miss:0, partial:0, total:0 };
    byCategory[cat].hit += (p.status === 'hit' ? 1 : 0);
    byCategory[cat].miss += (p.status === 'miss' ? 1 : 0);
    byCategory[cat].partial += (p.status === 'partial' ? 1 : 0);
    byCategory[cat].total += 1;
  });

  // By confidence bucket
  const byConf = { 'high':{hit:0,miss:0,partial:0,total:0}, 'mid':{hit:0,miss:0,partial:0,total:0}, 'low':{hit:0,miss:0,partial:0,total:0} };
  resolved.forEach(p => {
    const conf = p.confidence_at_creation || 60;
    let bucket = 'low';
    if (conf >= 80) bucket = 'high';
    else if (conf >= 70) bucket = 'mid';
    byConf[bucket].hit += (p.status === 'hit' ? 1 : 0);
    byConf[bucket].miss += (p.status === 'miss' ? 1 : 0);
    byConf[bucket].partial += (p.status === 'partial' ? 1 : 0);
    byConf[bucket].total += 1;
  });

  // Render summary
  let html = `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">总体胜率</div>
        <div class="value ${winrate !== null ? (winrate >= 60 ? 'green' : winrate >= 40 ? 'gold' : 'red') : 'cyan'}">${winrate !== null ? winrate.toFixed(1) + '%' : '—'}</div>
        <div class="sub">Hit + 0.5×Partial / Total Resolved</div>
      </div>
      <div class="summary-card">
        <div class="label">已验证</div>
        <div class="value cyan">${resolvedTotal}</div>
        <div class="sub">✅ ${hit} · ⚡ ${partial} · ❌ ${miss}</div>
      </div>
      <div class="summary-card">
        <div class="label">待验证</div>
        <div class="value gold">${pending.length}</div>
        <div class="sub">按验证截止日期排序</div>
      </div>
      <div class="summary-card">
        <div class="label">总预测数</div>
        <div class="value">${total}</div>
        <div class="sub">累计所有历史记录</div>
      </div>
    </div>
  `;

  // By Category
  html += `
    <div class="section">
      <div class="section-title"><span class="icon">📊</span> 分类胜率对比</div>
      <div class="section-desc">各 AI 产业分类的历史命中率对比，验证不同赛道预测的可靠性差异</div>
      <div class="bar-chart">
  `;
  const catKeys = Object.keys(byCategory).sort((a,b) => {
    const wa = (byCategory[a].hit + byCategory[a].partial * 0.5) / byCategory[a].total;
    const wb = (byCategory[b].hit + byCategory[b].partial * 0.5) / byCategory[b].total;
    return wb - wa;
  });
  if (catKeys.length === 0) {
    html += '<p style="color:var(--text-dim);padding:20px 0;text-align:center">暂无已验证的分类数据</p>';
  } else {
    catKeys.forEach(cat => {
      const d = byCategory[cat];
      const wr = d.total > 0 ? ((d.hit + d.partial * 0.5) / d.total * 100) : 0;
      const cls = wr >= 60 ? 'green' : wr >= 40 ? 'gold' : 'red';
      html += `
        <div class="bar-row">
          <div class="bar-label">${escapeHtml(cat)}</div>
          <div class="bar-track"><div class="bar-fill ${cls}" style="width:${wr}%"></div></div>
          <div class="bar-value" style="color:var(--${cls === 'green' ? 'green' : cls === 'gold' ? 'gold' : 'red'})">${wr.toFixed(0)}%</div>
        </div>
      `;
    });
  }
  html += `</div></div>`;

  // By Confidence Bucket
  html += `
    <div class="section">
      <div class="section-title"><span class="icon">🎯</span> 置信度校准分析</div>
      <div class="section-desc">对比「创建时置信度」与「实际命中率」，验证 AI 置信度打分的校准能力。理想情况下高置信度 = 高命中率</div>
      <div class="bar-chart">
  `;
  const bucketLabels = { high: '≥80% (高置信)', mid: '70-79% (中置信)', low: '<70% (低置信)' };
  ['high','mid','low'].forEach(b => {
    const d = byConf[b];
    const wr = d.total > 0 ? ((d.hit + d.partial * 0.5) / d.total * 100) : 0;
    const cls = wr >= 60 ? 'green' : wr >= 40 ? 'gold' : 'red';
    html += `
      <div class="bar-row">
        <div class="bar-label">${bucketLabels[b]}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${wr}%"></div></div>
        <div class="bar-value" style="color:var(--${cls === 'green' ? 'green' : cls === 'gold' ? 'gold' : 'red'})">${wr.toFixed(0)}%</div>
      </div>
    `;
  });
  html += `</div></div>`;

  // Pending predictions
  html += `
    <div class="section" id="pending">
      <div class="section-title"><span class="icon">⏳</span> 待验证预测</div>
      <div class="section-desc">按验证截止日期排序，展示最新待验证的预测记录及倒计时</div>
      <div class="table-wrap">
        <table class="detail-table">
          <thead>
            <tr>
              <th style="width:20%">预测标题</th>
              <th style="width:10%">分类</th>
              <th style="width:8%">置信度</th>
              <th style="width:12%">验证截止</th>
              <th style="width:8%">倒计时</th>
              <th style="width:10%">原文</th>
            </tr>
          </thead>
          <tbody>
  `;
  const sortedPending = [...pending].sort((a,b) => {
    const da = new Date(a.verify_deadline || '9999');
    const db = new Date(b.verify_deadline || '9999');
    return da - db;
  });
  if (sortedPending.length === 0) {
    html += '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:30px">暂无待验证预测</td></tr>';
  } else {
    sortedPending.forEach(p => {
      const days = daysUntilDeadline(p.verify_deadline);
      const daysStr = days !== null ? (days < 0 ? `已逾期 ${-days}天` : `${days} 天`) : '—';
      const urgent = days !== null && days < 30;
      html += `
        <tr>
          <td style="font-weight:600">${escapeHtml((p.prediction || '').substring(0, 80))}</td>
          <td>${escapeHtml(p.category || '')}</td>
          <td style="font-weight:700;color:var(--gold)">${p.confidence_at_creation}%</td>
          <td>${escapeHtml(p.verify_deadline || '')}</td>
          <td><span class="countdown ${urgent ? 'urgent' : ''}">${daysStr}</span></td>
          <td>${p.source_url ? `<a href="${escapeHtml(p.source_url)}" target="_blank" style="color:var(--cyan);text-decoration:none">🔗</a>` : '—'}</td>
        </tr>
      `;
    });
  }
  html += '</tbody></table></div></div>';

  // Resolved predictions
  html += `
    <div class="section" id="resolved">
      <div class="section-title"><span class="icon">✅</span> 历史验证记录</div>
      <div class="section-desc">已完成验证的预测列表，点击查看 AI 判定理由</div>
      <div class="table-wrap">
        <table class="detail-table">
          <thead>
            <tr>
              <th style="width:18%">预测标题</th>
              <th style="width:8%">分类</th>
              <th style="width:6%">置信度</th>
              <th style="width:8%">结果</th>
              <th style="width:10%">验证日期</th>
              <th style="width:20%">判定理由</th>
              <th style="width:6%">原文</th>
            </tr>
          </thead>
          <tbody>
  `;
  if (resolved.length === 0) {
    html += '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:30px">暂无已验证记录</td></tr>';
  } else {
    resolved.forEach((p, idx) => {
      const reasoning = escapeHtml(p.resolution_reasoning || '无判定理由');
      const statusLabel = p.status === 'hit' ? '✅ 命中' : p.status === 'miss' ? '❌ 未中' : '⚡ 部分';
      const displayText = (p.prediction || '').substring(0, 60);
      const hasMore = (p.prediction || '').length > 60;
      html += `
        <tr class="pred-row" data-detail="detail-${idx}" style="cursor:pointer">
          <td style="font-weight:600">${escapeHtml(displayText)}${hasMore ? '...' : ''}<span style="color:var(--gold);margin-left:6px;font-size:11px">▼</span></td>
          <td>${escapeHtml(p.category || '')}</td>
          <td style="color:var(--gold);font-weight:600">${p.confidence_at_creation}%</td>
          <td><span class="status-badge ${p.status}">${statusLabel}</span></td>
          <td>${escapeHtml((p.resolution_date || '').split('T')[0])}</td>
          <td style="color:var(--text-dim);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${reasoning}">${reasoning}</td>
          <td>${p.source_url ? `<a href="${escapeHtml(p.source_url)}" target="_blank" style="color:var(--cyan);text-decoration:none" onclick="event.stopPropagation()">🔗</a>` : '—'}</td>
        </tr>
        <tr class="pred-detail-row" id="detail-${idx}">
          <td colspan="7"><p><strong style="color:var(--gold)">判定理由：</strong>${reasoning}</p></td>
        </tr>
      `;
    });
  }
  html += '</tbody></table></div></div>';

  document.getElementById('dashboard').innerHTML = html;

  // Attach click handlers for expanding prediction details
  document.querySelectorAll('.pred-row').forEach(row => {
    row.addEventListener('click', () => {
      const detailId = row.getAttribute('data-detail');
      const detailRow = document.getElementById(detailId);
      if (detailRow) {
        detailRow.classList.toggle('show');
        const arrow = row.querySelector('span');
        if (arrow) {
          arrow.textContent = detailRow.classList.contains('show') ? '▲' : '▼';
        }
      }
    });
  });

  // Check anchor
  if (window.location.hash === '#pending') {
    const el = document.getElementById('pending');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }
}

async function init() {
  try {
    const data = await loadPredictions();
    const predictions = Array.isArray(data) ? data : (data.predictions || []);
    renderDashboard(predictions);
  } catch (e) {
    console.error(e);
    document.getElementById('dashboard').innerHTML =
      '<div class="loading"><p>⚠️ 预测数据加载失败</p></div>';
  }
}

// Chat widget
const widget = document.getElementById('ai-widget');
const panel = document.getElementById('chat-panel');
const overlay = document.getElementById('chat-overlay');
const closeBtn = document.getElementById('chat-close');
widget.addEventListener('click', () => { panel.classList.add('open'); overlay.classList.add('active'); });
closeBtn.addEventListener('click', closeChat);
overlay.addEventListener('click', closeChat);
function closeChat(){ panel.classList.remove('open'); overlay.classList.remove('active'); }

const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatMessages = document.getElementById('chat-messages');
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });
function sendMessage() {
  const val = chatInput.value.trim();
  if (!val) return;
  addMessage(val, 'user');
  chatInput.value = '';
  setTimeout(() => {
    const responses = [
      '关于胜率解读：60%+ 为高可靠，40-60% 为中等，<40% 需谨慎。请关注置信度校准是否合理——如果高置信度命中率反而低，说明模型过度自信。',
      'partial 命中按 0.5 权重计算是行业标准做法，因为部分命中说明预测方向正确但幅度/节奏可能有偏差，这是最常见的 AI 预测结果。',
      '分类胜率差异揭示了不同 AI 赛道的可预测性。基础模型和 AI 基础设施类通常更可预测（供应链可追踪），而 AI 应用类更依赖市场判断。',
    ];
    addMessage(responses[Math.floor(Math.random()*responses.length)], 'ai');
  }, 500);
}

init();
</script>
</body>
</html>
