<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha 深度决策版 (Pro)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 840px; margin: 0 auto; }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1e293b; padding: 12px 20px; border-radius: 12px; border: 1px solid #334155; }
        .nav-title { font-size: 1.05rem; font-weight: bold; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .back-btn { background: #334155; color: #cbd5e1; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.88rem; }
        .back-btn:hover { background: #475569; }

        h1 { text-align: center; font-size: 1.8rem; margin-top: 10px; margin-bottom: 5px; color: #f8fafc; }
        .status-bar { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 25px; }
        .status-badge { background: #1e293b; padding: 3px 10px; border-radius: 12px; border: 1px solid #334155; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .source-tag { font-size: 0.8rem; background: #312e81; color: #a5b4fc; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .time-tag { font-size: 0.8rem; color: #64748b; }
        .title { font-size: 1.15rem; font-weight: bold; margin-bottom: 14px; line-height: 1.4; color: #f8fafc; }
        
        .section { margin-top: 10px; font-size: 0.92rem; line-height: 1.55; border-radius: 6px; padding: 10px 14px; }
        .label { font-weight: bold; display: inline-block; margin-bottom: 2px; }
        
        .fact-summary { background: #0f172a; color: #cbd5e1; border-left: 4px solid #64748b; border: 1px solid #334155; }
        .order1 { background: #032830; color: #38bdf8; border-left: 4px solid #0284c7; }
        .order2 { background: #2c1a0e; color: #fb923c; border-left: 4px solid #ea580c; }
        
        .empty-state { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <div class="nav-title">🔥 Alpha 深度决策版 (Pro)</div>
            <a href="./index.html" class="back-btn">← 返回标准版</a>
        </div>

        <h1>🔥 Alpha 深度决策观测站 (Pro)</h1>
        <div class="status-bar">
            <span class="status-badge" id="update-time">最后更新时间: 加载中...</span>
        </div>

        <div id="cards-container">
            <div class="empty-state">正在拉取最新 Alpha 推理数据...</div>
        </div>
    </div>

    <script>
        async function fetchProResults() {
            const container = document.getElementById('cards-container');
            const timeTag = document.getElementById('update-time');

            const primaryUrl = 'https://raw.githubusercontent.com/chuleiyang4-ctrl/my-ai-pipeline/main/alpha_results.json?t=' + new Date().getTime();
            const fallbackUrl = './alpha_results.json?t=' + new Date().getTime();

            let data = null;

            try {
                let response = await fetch(primaryUrl);
                if (!response.ok) response = await fetch(fallbackUrl);
                data = await response.json();
            } catch (error) {
                try {
                    const res = await fetch(fallbackUrl);
                    data = await res.json();
                } catch (e) {
                    console.error(e);
                }
            }

            if (!data) {
                timeTag.innerText = '最后更新时间: 读取失败';
                container.innerHTML = '<div class="empty-state">加载数据失败。</div>';
                return;
            }

            let cardsList = Array.isArray(data) ? data : (data.cards || []);
            timeTag.innerText = '最后更新时间: ' + (data.updated_at || '实时更新');

            if (!cardsList || cardsList.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无最新推演卡片。</div>';
                return;
            }

            container.innerHTML = '';
            cardsList.forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="source-tag">${item.source_name || 'Alpha 研判'}</span>
                            <span class="time-tag">${item.published_at || ''}</span>
                        </div>
                        <div class="title">${item.title || '核心动态'}</div>
                        
                        <div class="section fact-summary">
                            <span class="label">📌 事实摘要：</span>${item.summary || item.fact_summary || '暂无摘要'}
                        </div>
                        <div class="section order1">
                            <span class="label">🎯 一阶直接影响：</span>${item.first_order_impact || item.first_order || '暂无分析'}
                        </div>
                        <div class="section order2">
                            <span class="label">🧩 二阶深度推演：</span>${item.second_order_reasoning || item.second_order || '暂无推演'}
                        </div>
                    </div>
                `;
            });
        }

        fetchProResults();
    </script>
</body>
</html>
