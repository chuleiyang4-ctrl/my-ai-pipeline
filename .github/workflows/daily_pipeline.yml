name: Daily AI Pipeline Task

# 触发条件：每天定时自动运行 + 支持手动点击触发
on:
  schedule:
    #  UTC 时间每天凌晨 00:00 (相当于北京时间早上 08:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 界面上手动点击按钮立即运行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取当前仓库的代码
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装依赖包
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 运行 main.py 脚本 (传入 GEMINI_API_KEY)
    - name: Run AI Pipeline Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python main.py

    # 5. 将生成的 results.json 自动提交保存回仓库
    - name: Commit and Push Results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add results.json
        git diff-index --quiet HEAD || git commit -m "auto: update daily reasoning results [skip ci]"
        git push
